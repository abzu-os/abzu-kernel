name: Generate XNU Config Files

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    # Use a clean Debian container to avoid runner environment quirks
    container: debian:bookworm
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y build-essential bison flex curl tar

      - name: Download and Extract XNU 1228 Source
        run: |
          curl -L -o xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-1228.tar.gz
          tar -xzf xnu.tar.gz

      - name: Compile ONLY the 'config' tool
        run: |
          cd xnu-xnu-1228/config
          make clean >/dev/null 2>&1 || true
          # Force it to only build the 'config' binary by providing safe dummy paths
          make SRCROOT=.. OBJROOT=/tmp/obj DSTROOT=/tmp/dst config

      - name: Generate RELEASE_PPC configuration
        run: |
          cd xnu-xnu-1228
          mkdir -p BUILD/obj/RELEASE_PPC
          ./config/config -c ../conf BUILD/obj/RELEASE_PPC/config.RELEASE_PPC

      - name: Upload generated files as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-generated-config-files
          path: xnu-xnu-1228/BUILD/obj/RELEASE_PPC/
