name: Generate XNU Config Files

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Extract XNU 1228 Source
        run: |
          curl -sSL -o xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-1228.tar.gz
          tar -xzf xnu.tar.gz

      - name: Create work directory and scripts via Python
        run: |
          mkdir -p work
          python3 -c '
          sed_script = """
          /^+/{
          s;[-+];#&;gp
          t loop
          : loop
          n
          /^#/b loop
          /^$/b loop
          s;^\([^#]*\).*#[ \t]*<\(.*\)>[ \t]*$;\2#\1;
          t not
          s;\([^#]*\).*;#\1;
          t not
          : not
          s;[ \t]*$;;
          s;^\!\(.*\);\1#\!;
          p
          t loop
          b loop
          }
          /^[^#]/d
          s;\t; ;g
          s;^# *\([^ ]*\)[ ]*=[ ]*\[\(.*\)\].*;\1#\2;p
          """
          with open("work/merge.sed", "w") as f:
              f.write(sed_script.strip() + "\n")

          awk_script = """
          part == 0 && $1 != "" {
              m[$1]=m[$1] " " $2;
              next;
          }
          part == 0 && $1 == "" {
              for (i=NF;i>1;i--){
                  s=substr($i,2);
                  c[++na]=substr($i,1,1);
                  a[na]=s;
              }
              while (na > 0){
                  s=a[na];
                  d=c[na--];
                  if (m[s] == "") {
                      f[s]=d;
                  } else {
                      nx=split(m[s],x," ");
                      for (j=nx;j>0;j--) {
                          z=x[j];
                          a[++na]=z;
                          c[na]=d;
                      }
                  }
              }
              part=1;
              next;
          }
          part != 0 {
              if ($1 != "") {
                  n=split($1,x,",");
                  ok=0;
                  for (i=1;i<=n;i++) {
                      if (f[x[i]] == "+") {
                          ok=1;
                      }
                  }
                  if (NF > 2 && ok == 0 || NF <= 2 && ok != 0) {
                      print $2; 
                  }
              } else { 
                  print $2; 
              }
          }
          """
          with open("work/merge.awk", "w") as f:
              f.write(awk_script.strip() + "\n")
          '

      - name: Generate RELEASE_PPC configuration (Merge Stage)
        run: |
          set -eu
          cd xnu-xnu-1228/bsd/conf
          SYS=RELEASE_PPC
          cpu=ppc
          ID=PPC
          OBJDIR=../../BUILD/obj/RELEASE_PPC/conf
          mkdir -p "$OBJDIR"
          MASTER=./MASTER
          MASTER_CPU=./MASTER.ppc
          MASTER_LOCAL=""
          [ -f "$MASTER.local" ] && MASTER_LOCAL="$MASTER.local"
          MASTER_CPU_LOCAL=""
          [ -f "$MASTER_CPU.local" ] && MASTER_CPU_LOCAL="$MASTER_CPU.local"
          
          cat "$MASTER" ${MASTER_LOCAL:+"$MASTER_LOCAL"} \
              "$MASTER_CPU" ${MASTER_CPU_LOCAL:+"$MASTER_CPU_LOCAL"} \
              <(echo "+$SYS") \
              "$MASTER" ${MASTER_LOCAL:+"$MASTER_LOCAL"} \
              "$MASTER_CPU" ${MASTER_CPU_LOCAL:+"$MASTER_CPU_LOCAL"} \
            | sed -n -f ../../../work/merge.sed \
            | awk -F# -f ../../../work/merge.awk \
            > "$OBJDIR/config.${SYS}_${ID}.new"
            
          test -s "$OBJDIR/config.${SYS}_${ID}.new" || {
            echo "ERROR: merge produced empty output"; exit 1; }
          mv "$OBJDIR/config.${SYS}_${ID}.new" "$OBJDIR/config.${SYS}_${ID}"
          cp "$OBJDIR/config.${SYS}_${ID}" "$OBJDIR/config.${SYS}"
          ls -l "$OBJDIR"

      - name: Compile authentic NetBSD config tool (Fixed)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libbsd-dev
          
          mkdir -p netbsd-config/sys
          cd netbsd-config
          
          curl -sSL -O https://raw.githubusercontent.com/NetBSD/src/netbsd-9/usr.bin/config/main.c
          curl -sSL -O https://raw.githubusercontent.com/NetBSD/src/netbsd-9/usr.bin/config/mkheaders.c
          curl -sSL -O https://raw.githubusercontent.com/NetBSD/src/netbsd-9/usr.bin/config/mkmakefile.c
          curl -sSL -O https://raw.githubusercontent.com/NetBSD/src/netbsd-9/usr.bin/config/mkioconf.c
          curl -sSL -O https://raw.githubusercontent.com/NetBSD/src/netbsd-9/usr.bin/config/gram.y
          curl -sSL -O https://raw.githubusercontent.com/NetBSD/src/netbsd-9/usr.bin/config/scan.l
          curl -sSL -O https://raw.githubusercontent.com/NetBSD/src/netbsd-9/usr.bin/config/defs.h
          curl -sSL -O https://raw.githubusercontent.com/NetBSD/src/netbsd-9/usr.bin/config/util.h
          
          echo "// dummy header for Ubuntu 24.04 compatibility" > sys/sysctl.h
          
          bison -d -o gram.c gram.y
          flex -o scan.c scan.l
          
          gcc -I. -I./sys -D'__RCSID(x)=' -D'COPYRIGHT(x)=' -D'__COPYRIGHT(x)=' -I/usr/include/bsd -o config main.c mkheaders.c mkmakefile.c mkioconf.c gram.c scan.c -lfl -lbsd
          
          sudo mv config /usr/local/bin/config

      - name: Run authentic NetBSD config tool
        run: |
          set -eu
          cd xnu-xnu-1228/bsd
          CONF_FILE=../BUILD/obj/RELEASE_PPC/conf/config.RELEASE_PPC
          
          echo 'builddir	"."' >> "$CONF_FILE"
          echo 'objectdir	"'"$(pwd)/../BUILD/obj/RELEASE_PPC"'"' >> "$CONF_FILE"
          echo 'sourcedir	"'"$(pwd)/.."'"' >> "$CONF_FILE"
          
          /usr/local/bin/config -c ./conf "$CONF_FILE"
          
          echo "=== Generated Files ==="
          ls -lh ../BUILD/obj/RELEASE_PPC/

      - name: Upload generated files as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-generated-config-files
          path: xnu-xnu-1228/BUILD/obj/RELEASE_PPC/
