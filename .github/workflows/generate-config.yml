name: Generate XNU Config Files

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Extract XNU 1228 Source
        run: |
          curl -sSL -o xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-1228.tar.gz
          tar -xzf xnu.tar.gz

      - name: Create work directory and scripts
        run: |
          mkdir -p work
          cat > work/merge.sed <<'SED_EOF'
  /^+/{
  s;[-+];#&;gp
  t loop
  : loop
  n
  /^#/b loop
  /^$/b loop
  s;^\([^#]*\).*#[ 	]*<\(.*\)>[ 	]*$;\2#\1;
  t not
  s;\([^#]*\).*;#\1;
  t not
  : not
  s;[ 	]*$;;
  s;^\!\(.*\);\1#\!;
  p
  t loop
  b loop
  }
  /^[^#]/d
  s;	; ;g
  s;^# *\([^ ]*\)[ ]*=[ ]*\[\(.*\)\].*;\1#\2;p
SED_EOF

          cat > work/merge.awk <<'AWK_EOF'

  part == 0 && $1 != "" {
  	m[$1]=m[$1] " " $2;
  	next;
  }
  part == 0 && $1 == "" {
  	for (i=NF;i>1;i--){
  		s=substr($i,2);
  		c[++na]=substr($i,1,1);
  		a[na]=s;
  	}
  	while (na > 0){
  		s=a[na];
  		d=c[na--];
  		if (m[s] == "") {
  			f[s]=d;
  		} else {
  			nx=split(m[s],x," ");
  			for (j=nx;j>0;j--) {
  				z=x[j];
  				a[++na]=z;
  				c[na]=d;
  			}
  		}
  	}
  	part=1;
  	next;
  }
  part != 0 {
  	if ($1 != "") {
  		n=split($1,x,",");
  		ok=0;
  		for (i=1;i<=n;i++) {
  			if (f[x[i]] == "+") {
  				ok=1;
  			}
  		}
  		if (NF > 2 && ok == 0 || NF <= 2 && ok != 0) {
  			print $2; 
  		}
  	} else { 
  		print $2; 
  	}
  }
AWK_EOF

      - name: Generate RELEASE_PPC configuration
        run: |
          set -eu
          cd xnu-xnu-1228/bsd/conf
          SYS=RELEASE_PPC
          cpu=ppc          # from: -cpu ppc  ->  lowercased
          ID=PPC           # from: -cpu ppc  ->  uppercased
          # FIX: Changed ../BUILD to ../../BUILD to correctly target the XNU root directory
          OBJDIR=../../BUILD/obj/RELEASE_PPC/conf
          mkdir -p "$OBJDIR"
          MASTER=./MASTER
          MASTER_CPU=./MASTER.ppc
          MASTER_LOCAL=""
          [ -f "$MASTER.local" ] && MASTER_LOCAL="$MASTER.local"
          MASTER_CPU_LOCAL=""
          [ -f "$MASTER_CPU.local" ] && MASTER_CPU_LOCAL="$MASTER_CPU.local"
          
          cat "$MASTER" ${MASTER_LOCAL:+"$MASTER_LOCAL"} \
              "$MASTER_CPU" ${MASTER_CPU_LOCAL:+"$MASTER_CPU_LOCAL"} \
              <(echo "+$SYS") \
              "$MASTER" ${MASTER_LOCAL:+"$MASTER_LOCAL"} \
              "$MASTER_CPU" ${MASTER_CPU_LOCAL:+"$MASTER_CPU_LOCAL"} \
            | sed -n -f ../../../work/merge.sed \
            | awk -F# -f ../../../work/merge.awk \
            > "$OBJDIR/config.${SYS}_${ID}.new"
            
          test -s "$OBJDIR/config.${SYS}_${ID}.new" || {
            echo "ERROR: merge produced empty output"; exit 1; }
          mv "$OBJDIR/config.${SYS}_${ID}.new" "$OBJDIR/config.${SYS}_${ID}"
          cp "$OBJDIR/config.${SYS}_${ID}" "$OBJDIR/config.${SYS}"
          ls -l "$OBJDIR"

      - name: Verify sh port matches doconf.csh
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y csh
          
          rm -rf selfcheck && mkdir -p selfcheck/conf selfcheck/h selfcheck/BUILD
          cp xnu-xnu-1228/bsd/conf/MASTER xnu-xnu-1228/bsd/conf/MASTER.ppc selfcheck/conf/
          touch selfcheck/h/cs_dummy.h
          
          awk "/' >\\\$SYSCONF.new/{print; exit} {print}" \
              xnu-xnu-1228/bsd/conf/tools/doconf/doconf.csh > selfcheck/doconf_merge.csh
          echo 'exit 0' >> selfcheck/doconf_merge.csh
          chmod +x selfcheck/doconf_merge.csh
          
          ( cd selfcheck/conf && csh -f ../doconf_merge.csh -verbose -cpu ppc RELEASE_PPC )
          
          csh_out=selfcheck/BUILD/config.RELEASE_PPC_PPC.new
          sh_out=xnu-xnu-1228/BUILD/obj/RELEASE_PPC/conf/config.RELEASE_PPC_PPC
          
          test -s "$csh_out" || { echo "ERROR: csh reference produced no output"; exit 1; }
          if diff -u "$csh_out" "$sh_out"; then
            echo "SELF-CHECK OK: sh port is byte-identical to doconf.csh merge output"
          else
            echo "ERROR: sh port diverges from doconf.csh"
            exit 1
          fi

      - name: Upload generated files as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-generated-config-files
          # FIX: Updated path to include the conf/ directory where the files are actually generated
          path: xnu-xnu-1228/BUILD/obj/RELEASE_PPC/conf/
