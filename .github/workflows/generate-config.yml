name: Generate XNU Config Files

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Extract XNU 1228 Source
        run: |
          curl -sSL -o xnu.tar.gz https://github.com/apple-oss-distributions/xnu/archive/refs/tags/xnu-1228.tar.gz
          tar -xzf xnu.tar.gz

      - name: Create work directory and scripts via Python
        run: |
          mkdir -p work
          python3 -c '
          sed_script = r"""
          /^+/{
          s;[-+];#&;gp
          t loop
          : loop
          n
          /^#/b loop
          /^$/b loop
          s;^\([^#]*\).*#[ \t]*<\(.*\)>[ \t]*$;\2#\1;
          t not
          s;\([^#]*\).*;#\1;
          t not
          : not
          s;[ \t]*$;;
          s;^\!\(.*\);\1#\!;
          p
          t loop
          b loop
          }
          /^[^#]/d
          s;\t; ;g
          s;^# *\([^ ]*\)[ ]*=[ ]*\[\(.*\)\].*;\1#\2;p
          """
          with open("work/merge.sed", "w") as f:
              f.write(sed_script.strip() + "\n")

          awk_script = r"""
          part == 0 && $1 != "" {
              m[$1]=m[$1] " " $2;
              next;
          }
          part == 0 && $1 == "" {
              for (i=NF;i>1;i--){
                  s=substr($i,2);
                  c[++na]=substr($i,1,1);
                  a[na]=s;
              }
              while (na > 0){
                  s=a[na];
                  d=c[na--];
                  if (m[s] == "") {
                      f[s]=d;
                  } else {
                      nx=split(m[s],x," ");
                      for (j=nx;j>0;j--) {
                          z=x[j];
                          a[++na]=z;
                          c[na]=d;
                      }
                  }
              }
              part=1;
              next;
          }
          part != 0 {
              if ($1 != "") {
                  n=split($1,x,",");
                  ok=0;
                  for (i=1;i<=n;i++) {
                      if (f[x[i]] == "+") {
                          ok=1;
                      }
                  }
                  if (NF > 2 && ok == 0 || NF <= 2 && ok != 0) {
                      print $2; 
                  }
              } else { 
                  print $2; 
              }
          }
          """
          with open("work/merge.awk", "w") as f:
              f.write(awk_script.strip() + "\n")
          '

      - name: Generate RELEASE_PPC configuration (Merge Stage)
        run: |
          set -eu
          cd xnu-xnu-1228/bsd/conf
          SYS=RELEASE_PPC
          cpu=ppc
          ID=PPC
          OBJDIR=../../BUILD/obj/RELEASE_PPC/conf
          mkdir -p "$OBJDIR"
          MASTER=./MASTER
          MASTER_CPU=./MASTER.ppc
          MASTER_LOCAL=""
          [ -f "$MASTER.local" ] && MASTER_LOCAL="$MASTER.local"
          MASTER_CPU_LOCAL=""
          [ -f "$MASTER_CPU.local" ] && MASTER_CPU_LOCAL="$MASTER_CPU.local"
          
          cat "$MASTER" ${MASTER_LOCAL:+"$MASTER_LOCAL"} \
              "$MASTER_CPU" ${MASTER_CPU_LOCAL:+"$MASTER_CPU_LOCAL"} \
              <(echo "+$SYS") \
              "$MASTER" ${MASTER_LOCAL:+"$MASTER_LOCAL"} \
              "$MASTER_CPU" ${MASTER_CPU_LOCAL:+"$MASTER_CPU_LOCAL"} \
            | sed -n -f ../../../work/merge.sed \
            | awk -F# -f ../../../work/merge.awk \
            > "$OBJDIR/config.${SYS}_${ID}.new"
            
          test -s "$OBJDIR/config.${SYS}_${ID}.new" || {
            echo "ERROR: merge produced empty output"; exit 1; }
          mv "$OBJDIR/config.${SYS}_${ID}.new" "$OBJDIR/config.${SYS}_${ID}"
          cp "$OBJDIR/config.${SYS}_${ID}" "$OBJDIR/config.${SYS}"
          ls -l "$OBJDIR"

      - name: Compile authentic NetBSD config tool (Fully Verified URLs)
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libbsd-dev zlib1g-dev
          
          mkdir -p netbsd-config/sys
          cd netbsd-config
          
          # Helper function to download files and FAIL immediately if 404
          fetch() {
            curl -sSfL -o "$2" "$1"
          }
          
          NB=https://raw.githubusercontent.com/NetBSD/src/netbsd-9
          
          # Download NetBSD config tool source (VERIFIED PATHS)
          fetch $NB/usr.bin/config/main.c main.c
          fetch $NB/usr.bin/config/mkheaders.c mkheaders.c
          fetch $NB/usr.bin/config/mkmakefile.c mkmakefile.c
          fetch $NB/usr.bin/config/mkioconf.c mkioconf.c
          fetch $NB/usr.bin/config/gram.y gram.y
          fetch $NB/usr.bin/config/scan.l scan.l
          fetch $NB/usr.bin/config/defs.h defs.h
          fetch $NB/usr.bin/config/util.c util.c
          # sem.h lives in usr.bin/config itself, NOT in sys/sys (that path 404s)
          fetch $NB/usr.bin/config/sem.h sem.h
          
          # Dependency headers (VERIFIED PATHS)
          # vis.h lives in include/, NOT lib/libc/include/ (that path 404s)
          fetch $NB/include/vis.h vis.h
          # crc_buf() comes from usr.bin/cksum (see usr.bin/config/Makefile);
          # crc_extern.h does not exist under lib/libc/include/ (that path 404s)
          fetch $NB/usr.bin/cksum/crc.c crc.c
          fetch $NB/usr.bin/cksum/crc_extern.h crc_extern.h
          fetch $NB/usr.bin/cksum/extern.h extern.h
          
          # <util.h>: use the system one from libbsd-dev (/usr/include/bsd/util.h)
          
          # Create dummy sys/sysctl.h (Ubuntu 24.04 removed this from glibc)
          echo "// dummy header for Ubuntu 24.04 compatibility" > sys/sysctl.h
          
          # Portability shim so NetBSD sources compile against glibc
          cat > compat.h <<'EOF'
          /* Portability shim: build NetBSD config(8) on Linux/glibc */
          #include <stdint.h>
          #include <inttypes.h>
          
          /* glibc defines these as macros/enums that clash with NetBSD defs.h */
          #ifdef NODEV
          #undef NODEV
          #endif
          #ifdef major
          #undef major
          #endif
          #ifdef minor
          #undef minor
          #endif
          
          #define __RENAME(x)
          #define __UNCONST(a)    ((void *)(unsigned long)(const void *)(a))
          #ifndef __arraycount
          #define __arraycount(a) (sizeof(a) / sizeof((a)[0]))
          #endif
          #ifndef MIN
          #define MIN(a,b) (((a)<(b))?(a):(b))
          #endif
          #ifndef MAX
          #define MAX(a,b) (((a)>(b))?(a):(b))
          #endif
          EOF
          
          # Safely prepend the shim to defs.h to fix missing types/macros
          printf '#include "compat.h"\ntypedef int devmajor_t;\n' | cat - defs.h > temp_defs.h && mv temp_defs.h defs.h
          
          # gram.y calls check_version() before its static definition; add a prototype
          sed -i 's/^static void$/void/' gram.y || true
          printf '\nvoid check_version(void);\n' >> defs.h
          
          # Final sanity check: ensure no file is a 404 page
          if grep -q "404: Not Found" *.c *.h *.y *.l 2>/dev/null; then
            echo "ERROR: A downloaded file contains a 404 error!"
            exit 1
          fi
          
          bison -d -o gram.c gram.y
          flex -o scan.c scan.l
          
          # Compile with stubs for NetBSD-specific macros and safe include paths
          gcc -I. -I./sys \
              -D'__RCSID(x)=' \
              -D'__COPYRIGHT(x)=' \
              -D'__unused=' \
              -D'__printflike(x,y)=' \
              -I/usr/include/bsd \
              -o config main.c mkheaders.c mkmakefile.c mkioconf.c gram.c scan.c util.c crc.c -lfl -lbsd -lz
          
          test -x config || { echo "ERROR: config binary was not built"; exit 1; }
          sudo mv config /usr/local/bin/config

      - name: Run authentic NetBSD config tool
        run: |
          set -eu
          cd xnu-xnu-1228/bsd
          CONF_FILE=../BUILD/obj/RELEASE_PPC/conf/config.RELEASE_PPC
          
          # Append the required paths for the config tool
          echo 'builddir	"."' >> "$CONF_FILE"
          echo 'objectdir	"'"$(pwd)/../BUILD/obj/RELEASE_PPC"'"' >> "$CONF_FILE"
          echo 'sourcedir	"'"$(pwd)/.."'"' >> "$CONF_FILE"
          
          # Run the locally compiled authentic NetBSD config tool
          /usr/local/bin/config -c ./conf "$CONF_FILE"
          
          echo "=== Generated Files ==="
          ls -lh ../BUILD/obj/RELEASE_PPC/

      - name: Upload generated files as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-generated-config-files
          path: xnu-xnu-1228/BUILD/obj/RELEASE_PPC/
