name: Build Abzu Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger a build from the Web UI

jobs:
  build:
    runs-on: macos-14 # GitHub provides free Apple Silicon runners!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build Kernel
        run: nix build .#abzu-xnu-10.5.8

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abzu-mach_kernel-ppc
          path: result/mach_kernel
