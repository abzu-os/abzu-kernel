name: Build Abzu Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build Kernel
        run: nix build .#abzu-xnu-10-5-8

      - name: Prepare Artifact (Detective Mode)
        run: |
          mkdir -p artifacts
          
          echo "=== DEBUG: Listing everything in the 'result' directory ==="
          ls -lR result/
          
          echo "=== DEBUG: Searching for any file with 'kernel' or 'mach' in the name ==="
          find result/ -type f \( -name "*kernel*" -o -name "*mach*" \)
          
          # Copy any matching files into the artifacts folder
          find result/ -type f \( -name "*kernel*" -o -name "*mach*" \) -exec cp {} artifacts/ \; || true
          
          echo "=== DEBUG: Final contents of artifacts folder ==="
          ls -lh artifacts/

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abzu-mach_kernel-ppc
          path: artifacts/
          if-no-files-found: error
