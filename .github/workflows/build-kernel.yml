name: Build Abzu Kernel

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Switch to Linux: Instant queues, no Intel Mac dependency, true cross-compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BSD config utility (required by XNU build system)
        run: |
          sudo apt-get update
          sudo apt-get install -y bsdmainutils

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build Kernel
        run: nix build .#abzu-xnu-10-5-8

      - name: Prepare Artifact
        run: |
          mkdir -p artifacts
          echo "=== DEBUG: Listing main build output directory ==="
          ls -lh BUILD/obj/RELEASE_PPC/ || true
          
          echo "=== DEBUG: Finding any file larger than 1MB ==="
          find BUILD/ -type f -size +1M || true
          
          cp BUILD/obj/RELEASE_PPC/mach_kernel artifacts/ 2>/dev/null || echo "mach_kernel not found at root"
          cp BUILD/obj/RELEASE_PPC/kernel artifacts/ 2>/dev/null || echo "kernel not found at root"
          find BUILD/ -type f -size +1M -exec cp {} artifacts/ \; || true
          
          echo "=== DEBUG: Final contents of artifacts ==="
          ls -lh artifacts/

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abzu-mach_kernel-ppc
          path: artifacts/
          if-no-files-found: error
